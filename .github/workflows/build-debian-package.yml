name: Build DEB Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          lintian \
          devscripts \
          dh-dkms \
          debhelper \
          pve-headers-$(uname -r)

    - name: Build .deb package
      run: |
        debuild -us -uc -tc -b

    - name: Upload DEB artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: gasket-dkms
        path: ../gasket-dkms_1.0-18_all.deb
        if-no-files-found: error
